[project]
name = "anti-sedentary-bot"
version = "0.1.0"
description = "Telegram accountability bot for sedentary work — periodic micro-exercises with unlock timer and adaptive pressure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "tortoise-orm[asyncpg]>=0.21.7",
    "aerich>=0.7.2",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
    "aiohttp>=3.10",
]

[project.scripts]
anti-sedentary-bot = "anti_sedentary_bot.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anti_sedentary_bot"]

[tool.aerich]
tortoise_orm = "anti_sedentary_bot.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4"]
# RUF001/002/003: ambiguous unicode in russian strings (legitimate cyrillic).
# RUF059: ignore unused-unpacked tuple vars (common in tests).
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF059"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aerich.*", "apscheduler.*"]
ignore_missing_imports = true
